# Run all verifiers before each commit. Every job checks the whole project, not just staged
# files, so a commit can never pass here and fail on a fresh clone.
# Hooks are installed by `pnpm install` (the root `prepare` script).
# Run manually with: pnpm check
#
# Biome first fixes what it can in the staged files and stages the fixes, so formatting never fails a
# commit. The cheap verifiers then run together, and vitest only after they all pass: a cheap failure
# no longer throws away a vitest run.
pre-commit:
  piped: true
  jobs:
    - name: biome fix
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: cheap checks
      group:
        parallel: true
        jobs:
          - name: biome
            run: pnpm lint
          - name: typecheck
            run: pnpm typecheck
          - name: dependency-cruiser
            run: pnpm depcruise
          - name: knip
            run: pnpm knip
    - name: vitest
      run: pnpm test
