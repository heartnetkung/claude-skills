# Run all verifiers before each commit. Every job checks the whole project, not just staged
# files, so a commit can never pass here and fail on a fresh clone.
# Hooks are installed by `pnpm install` (the root `prepare` script).
# Run manually with: pnpm check
pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
    - name: vitest
      run: pnpm test
    - name: dependency-cruiser
      run: pnpm depcruise
    - name: knip
      run: pnpm knip
