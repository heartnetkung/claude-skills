# Run all verifiers before each commit.
# Install with: uv run pre-commit install
# Run manually with: uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: tach
        name: tach
        entry: uv run tach check
        language: system
        types: [python]
        pass_filenames: false

      - id: tach-external
        name: tach check-external
        entry: uv run tach check-external
        language: system
        types: [python]
        pass_filenames: false

      - id: deptry
        name: deptry
        entry: uv run deptry src
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
